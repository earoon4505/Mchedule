        <h2>메이플스토리 주요 콘텐츠 리셋 주기</h2>
        <ul>
          <li><strong>일일 콘텐츠 (심볼 일일 퀘스트, 일일 보스, 몬스터파크)</strong>: 매일 오전 00:00 (자정) 리셋</li>
          <li><strong>주간 콘텐츠 (주간 레이드 보스, 에픽 던전, 주간 퀘스트)</strong>: 매주 목요일 오전 00:00 리셋 (강렬한 힘의 결정석 주간 60개 판매 한도 초기화)</li>
          <li><strong>월간 콘텐츠 (검은 마법사 하드 / 익스트림)</strong>: 매월 1일 오전 00:00 리셋</li>
        </ul>
